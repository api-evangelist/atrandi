aid: atrandi
name: Atrandi
description: 'Atrandi Biosciences (founded 2016 in Lithuania as Droplet Genomics) is a life-sciences
  tools company building droplet-microfluidic platforms and its patented Semi-Permeable Capsule (SPC)
  technology for single-cell analysis. SPCs isolate individual cells while letting reagents diffuse
  freely, enabling complex multi-step single-cell genomics, multiomics, and microbial whole-genome
  sequencing workflows. Atrandi ships instruments (Flux, Onyx, Styx), application kits, and consumables
  used by 200+ research groups worldwide. The company is a wet-lab instrumentation and consumables
  vendor and publishes no public developer API; this profile was surfaced as a portfolio company of
  Lux Capital and enriched with verified public identity, web properties, and domain-security posture.'
